services:
  api:
    build: .

    container_name: ai_hiring_api

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_hiring

    depends_on:
      - postgres

    volumes:
      - ./uploads:/app/uploads

  postgres:
    image: postgres:16

    container_name: ai_hiring_postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_hiring

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
